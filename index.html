<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Aetherum Battle Demo — Conductor Duelist vs Dock Brute</title>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>
  <div id="app">
    <header id="titleBar" class="panel">
      <h1>Aetherum Battle Demo</h1>
      <p>Conductor Duelist vs Dock Brute · SNES sprites + tabletop pack</p>
    </header>
    <div id="stage">
      <canvas id="c" width="256" height="224" aria-label="Battle sprites"></canvas>
      <div id="overlayMsg" class="hidden"></div>
      <div id="diceTheater" class="hidden" aria-live="polite"></div>
      <div id="riposteAsk" class="hidden" role="dialog" aria-label="Riposte choice">
        <p id="riposteAskText">Use Riposte (1 bank)?</p>
        <div class="riposteAskBtns">
          <button type="button" id="btnRiposteUse" class="btn danger">Use</button>
          <button type="button" id="btnRiposteSkip" class="btn">Skip</button>
        </div>
      </div>
    </div>
    <div id="chipRow" class="chipRow panel" aria-label="Status chips"></div>
    <section id="sheetPeek" class="panel sheetPeek hidden" aria-live="polite"></section>
    <section id="status" class="panel" aria-live="polite">
      <div class="stat"><span class="lbl">AP</span> <span id="statAp">—</span></div>
      <div class="stat"><span class="lbl">Bank</span> <span id="statBank">—</span></div>
      <div class="stat"><span class="lbl">AC</span> <span id="statAc">—</span></div>
      <div class="stat"><span class="lbl">Turn</span> <span id="statTurn">—</span></div>
      <div class="stat"><span class="lbl">Riposte</span> <span id="statRiposte">—</span></div>
      <div class="stat"><span class="lbl">Mod</span> <span id="statMod">none</span></div>
    </section>
    <section id="logPanel" class="panel">
      <h2>Battle Log</h2>
      <div id="log" role="log"></div>
    </section>
    <section id="actions" class="panel">
      <button type="button" id="btnFight" class="btn primary">Start Fight</button>
      <button type="button" id="btnStrike" class="btn" disabled>Strike 1AP</button>
      <button type="button" id="btnEnd" class="btn" disabled>End Turn</button>
      <button type="button" id="btnRiposte" class="btn danger hidden" disabled>Riposte (1 Bank)</button>
      <button type="button" id="btnRestart" class="btn primary hidden">Restart</button>
    </section>
    <section id="handPanel" class="panel">
      <h2>Hand <span id="handHint" class="hint"></span></h2>
      <div id="hand" class="hand"></div>
    </section>
  </div>
  <script src="sprites-duelist-a-0.js"></script>
  <script src="sprites-duelist-a-1.js"></script>
  <script src="sprites-duelist-a-2.js"></script>
  <script src="sprites-duelist-a-3.js"></script>
  <script src="sprites-duelist-a-4.js"></script>
  <script src="sprites-duelist-a-5.js"></script>
  <script src="sprites-duelist-b-0.js"></script>
  <script src="sprites-duelist-b-1.js"></script>
  <script src="sprites-duelist-b-2.js"></script>
  <script src="sprites-duelist-b-3.js"></script>
  <script src="sprites-duelist-b-4.js"></script>
  <script src="sprites-brute-a-0.js"></script>
  <script src="sprites-brute-a-1.js"></script>
  <script src="sprites-brute-a-2.js"></script>
  <script src="sprites-brute-b-0.js"></script>
  <script src="sprites-brute-b-1.js"></script>
  <script src="sprites-duelist_hurt.js"></script>
  <script src="sprites-brute_hurt.js"></script>
  <!-- Approved chips v3 (48x48) — sprites-chips*.js data URLs -->
  <script src="sprites-chips-0.js"></script>
  <script src="sprites-chips-1.js"></script>
  <script src="sprites-chips-2.js"></script>
  <script src="game.js"></script>
</body>
</html>
